name: Run NSScreenshotMaker

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system X11 and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libxcb-cursor0 libxcb-xinerama0 libx11-xcb1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-image0 libxcb-icccm4 libxcb-keysyms1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" Pillow piexif appdirs rarfile AnyQt PyQt5 pyforms-gui

      - name: Execute NSScreenshotMaker.py with virtual framebuffer
        env:
          SCREENSHOT_MAKER_KEY: ${{ secrets.SCREENSHOT_MAKER_KEY }}
        run: |
          mkdir -p ~/.local/share/NSScreenshotMaker
          xvfb-run --auto-servernum python NSScreenshotMaker.py -k ${{ secrets.SCREENSHOT_MAKER_KEY }}

      - name: Upload processed outputs from SD folder
        uses: actions/upload-artifact@v4
        with:
          name: generated-screenshots
          path: SD/
