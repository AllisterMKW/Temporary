name: Run NSScreenshotMaker

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies for GUI and Qt display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-glx

      - name: Install all required Python modules and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow piexif appdirs rarfile AnyQt pyforms

      - name: Execute NSScreenshotMaker.py with virtual framebuffer
        env:
          SCREENSHOT_MAKER_KEY: ${{ secrets.SCREENSHOT_MAKER_KEY }}
        run: |
          xvfb-run --auto-servernum python NSScreenshotMaker.py -k ${{ secrets.SCREENSHOT_MAKER_KEY }}

      - name: Upload processed outputs from SD folder
        uses: actions/upload-artifact@v4
        with:
          name: generated-screenshots
          path: SD/
